services:
  scheduler1:
    image: scheduler:latest
    restart: on-failure
    environment:
      TZ: Asia/Jakarta
      DEPLOYD_RAFT: /etc/deployd_scheduler/etcd-raft.yaml
    volumes:
      - ./src/config/raft1.yml:/etc/deployd_scheduler/etcd-raft.yaml
      - ./tmp1:/tmp
    ports:
      - "9501:9100"
    command: ["./scheduler"]
  scheduler2:
    image: scheduler:latest
    restart: on-failure
    environment:
      TZ: Asia/Jakarta
      DEPLOYD_RAFT: /etc/deployd_scheduler/etcd-raft.yaml
    volumes:
      - ./src/config/raft2.yml:/etc/deployd_scheduler/etcd-raft.yaml
      - ./tmp2:/tmp
    ports:
      - "9502:9100"
    command: ["./scheduler"]
  scheduler3:
    image: scheduler:latest
    restart: on-failure
    environment:
      TZ: Asia/Jakarta
      DEPLOYD_RAFT: /etc/deployd_scheduler/etcd-raft.yaml
    volumes:
      - ./src/config/raft3.yml:/etc/deployd_scheduler/etcd-raft.yaml
      - ./tmp3:/tmp
    ports:
      - "9503:9100"
    command: ["./scheduler"]

volumes:
  config:
    driver: local
