name: Release to Deployd cluster

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml 

  upload:
    runs-on: ubuntu-latest
    needs: build # Ensures job sequence
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist # Downloads files back into this folder

      - name: Verify archive exists
        run: ls -R dist

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:desain-gratis-ci

      - name: Send deploy metadata
        uses: desain-gratis/deployd-gh-action@v2
        with:
          url: http://tc-jkt1:9401
          namespace: deployd
          name: scheduler
          archive: dist
