name: Build & Deploy Go App

on:
  push:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      draft_tag: ${{ steps.draft_tag.outputs.draft_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Test
        run: make test

      - name: Build app and copy necessary files
        run: make build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          if-no-files-found: error
